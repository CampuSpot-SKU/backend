name: Agent eval (수동 실행)

# 신고 접수 대화 에이전트(ai/agent.py + backend 정책)를 실제 Gemini로 평가 (명세서 4-1, 작업 1-3f).
# Actions 탭 → "Agent eval" → Run workflow → 세트 선택.
#   main:  한비 예외처리 테스트 74개 + 흐름·악의 입력 (프롬프트를 고칠 때마다 회귀 확인)
#   extra: 위치 구조(건물·층·호실·근처·별칭)와 허위 신고 보조 세트
# 배포와는 무관. ai 서비스는 HTTP 없이 코드로 직접 불러 쓴다. 결과는 Summary + 아티팩트(agent-eval-result)에 남음.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "평가할 세트"
        type: choice
        options: [all, main, extra]
        default: all

jobs:
  eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: CampuSpot-SKU/ai
          path: ai-src

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ai-src

      - name: Run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/eval_report_agent.py --set ${{ inputs.set }} --workers 4 --out agent-eval-result.md

      - name: Summary
        if: always()
        run: head -30 agent-eval-result.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-eval-result-${{ inputs.set }}
          path: agent-eval-result.md
          if-no-files-found: ignore
